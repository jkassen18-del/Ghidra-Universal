// app — application entry point, headless `serve` CLI, and the JavaFX GUI.

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation project(':core')
    implementation project(':engine-ghidra')
    implementation project(':mcp-server')
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls']
}

application {
    mainClass = 'io.ghidrauniversal.app.Launcher'
}

// Forward headless-validation system properties (-Dgu.*) from -P project props to the run JVM.
run {
    ['gu.autoOpen', 'gu.screenshot', 'gu.exitAfterMs'].each { k ->
        if (project.hasProperty(k)) {
            systemProperty k, project.getProperty(k)
        }
    }
}
