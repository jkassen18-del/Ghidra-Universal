// Packaging: assemble a portable, self-contained bundle for the current OS.
//
//   ./gradlew bundle        -> dist/ghidra-universal/   (runtime + app + ghidra)
//   ./gradlew portableZip   -> dist/ghidra-universal-<os>.zip
//
// Runs identically on Windows / Linux / macOS; a CI matrix builds one per OS.
// The runtime is a full bundled JDK so it can run both the JavaFX app and
// Ghidra headless (which compiles scripts at runtime and so needs jdk.compiler).

project(':app') {

    def distRoot = rootProject.layout.projectDirectory.dir('dist').asFile
    def bundleDir = new File(distRoot, 'ghidra-universal')

    tasks.register('stageBundle') {
        group = 'bundling'
        description = 'Assemble dist/ghidra-universal for the current OS.'
        dependsOn tasks.named('jar')
        dependsOn configurations.runtimeClasspath   // ensure dependency jars are (re)built
        dependsOn rootProject.tasks.named('fetchGhidra')

        doLast {
            delete bundleDir
            bundleDir.mkdirs()

            // 1) Bundled runtime: the current JDK, minus build-time-only dirs.
            //    Use `cp -a` on Unix so dangling symlinks (e.g. the optional
            //    libatk-wrapper.so GTK shim) are copied as-is instead of followed.
            def javaHome = System.getProperty('java.home')
            def runtimeDir = new File(bundleDir, 'runtime')
            def currentOs = org.gradle.internal.os.OperatingSystem.current()
            if (currentOs.isWindows()) {
                copy {
                    from javaHome
                    into runtimeDir
                    exclude 'jmods/**', 'demo/**', 'man/**', 'include/**', 'sample/**'
                }
            } else {
                runtimeDir.mkdirs()
                exec { commandLine 'cp', '-a', "${javaHome}/.", runtimeDir.toString() }
                ['jmods', 'demo', 'man', 'include', 'sample'].each {
                    delete new File(runtimeDir, it)
                }
            }

            // 2) Application + dependency jars, with JavaFX split onto its own
            //    module path and everything else on the classpath.
            def appLib = new File(bundleDir, 'app/lib')
            def appFx = new File(bundleDir, 'app/javafx')
            appLib.mkdirs(); appFx.mkdirs()
            def jars = configurations.runtimeClasspath.resolve() + [tasks.jar.archiveFile.get().asFile]
            jars.each { f ->
                copy { from f; into (f.name.contains('javafx') ? appFx : appLib) }
            }

            // 3) Bundled Ghidra.
            copy {
                from rootProject.ext.ghidraInstallDir
                into new File(bundleDir, 'ghidra')
            }

            // 4) Launchers.
            copy {
                from rootProject.file('packaging/launchers')
                into bundleDir
            }
            new File(bundleDir, 'ghidra-universal.sh').setExecutable(true, false)

            // 5) Licenses / notices.
            def lic = new File(bundleDir, 'licenses'); lic.mkdirs()
            ['LICENSE', 'GPL', 'DISCLAIMER.md', 'bom.json'].each { name ->
                def src = new File(rootProject.ext.ghidraInstallDir, name)
                if (src.exists()) {
                    copy { from src; into new File(lic, 'ghidra') }
                }
            }
            def legal = new File(javaHome, 'legal')
            if (legal.exists()) {
                copy { from legal; into new File(lic, 'runtime') }
            }

            logger.lifecycle("Bundle staged at ${bundleDir}")
        }
    }

    tasks.register('bundle') {
        group = 'bundling'
        description = 'Alias for stageBundle.'
        dependsOn 'stageBundle'
    }

    tasks.register('portableZip', Zip) {
        group = 'bundling'
        description = 'Zip the staged bundle for distribution.'
        dependsOn 'stageBundle'
        def os = org.gradle.internal.os.OperatingSystem.current()
        def osName = os.isWindows() ? 'windows' : (os.isMacOsX() ? 'macos' : 'linux')
        archiveFileName = "ghidra-universal-${project.version}-${osName}.zip"
        destinationDirectory = distRoot
        from(bundleDir) { into 'ghidra-universal' }
    }

    // --- jpackage: a native app-image with a real launcher executable ---
    // Produces dist/jpackage/ghidra-universal/ containing ghidra-universal(.exe),
    // a bundled runtime (all JDK modules + JavaFX, so Ghidra works and has a
    // compiler), and the Ghidra install. On Windows the launcher is a .exe.

    def jpWork = project.layout.buildDirectory.dir('jpackage').get().asFile
    def jpInput = new File(jpWork, 'input')
    def jpFx = new File(jpWork, 'fx')
    def jpImageParent = new File(distRoot, 'jpackage')

    tasks.register('jpackageStage') {
        group = 'bundling'
        dependsOn tasks.named('jar')
        dependsOn configurations.runtimeClasspath
        dependsOn rootProject.tasks.named('fetchGhidra')
        doLast {
            delete jpInput, jpFx
            jpInput.mkdirs(); jpFx.mkdirs()
            def jars = configurations.runtimeClasspath.resolve() + [tasks.jar.archiveFile.get().asFile]
            jars.each { f ->
                copy { from f; into (f.name.contains('javafx') ? jpFx : jpInput) }
            }
        }
    }

    tasks.register('jpackageImage', Exec) {
        group = 'bundling'
        description = 'Build a portable app-image with a native launcher (ghidra-universal[.exe]).'
        dependsOn 'jpackageStage'

        def javaHome = System.getProperty('java.home')
        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        def jpackageBin = new File(javaHome, 'bin/jpackage' + (currentOs.isWindows() ? '.exe' : '')).toString()
        def appJar = tasks.jar.archiveFile.get().asFile.name
        def appVersion = (project.version as String).replace('-SNAPSHOT', '')

        // The JDK can usually be used directly as the runtime image. On Linux
        // some JDKs carry dangling symlinks (e.g. libatk-wrapper.so) that break
        // jpackage's runtime copy, so there we hand it a sanitized `cp -a` copy
        // with dangling symlinks pruned. (Windows and macOS JDKs don't need it;
        // macOS `find` also lacks GNU's -xtype.)
        def needsSanitize = currentOs.isLinux()
        def runtimeSrc = new File(jpWork, 'runtime-src')
        def runtimeImage = needsSanitize ? runtimeSrc.toString() : javaHome

        doFirst {
            delete new File(jpImageParent, 'ghidra-universal'); jpImageParent.mkdirs()
            if (needsSanitize) {
                delete runtimeSrc
                runtimeSrc.mkdirs()
                exec { commandLine 'cp', '-a', "${javaHome}/.", runtimeSrc.toString() }
                // Remove dangling symlinks so jpackage's copy doesn't choke.
                exec { commandLine 'bash', '-c',
                       "find '${runtimeSrc}' -type l ! -exec test -e {} ';' -print0 | xargs -0 -r rm -f" }
            }
        }

        // The runtime is a FULL JDK (via --runtime-image), not a jlink image:
        // jpackage strips bin/java from jlink runtimes, but Ghidra's
        // analyzeHeadless needs $JAVA_HOME/bin/java (and a compiler). JavaFX is
        // supplied on the module path from the app dir ($APPDIR/javafx).
        commandLine jpackageBin,
                '--type', 'app-image',
                '--name', 'ghidra-universal',
                '--dest', jpImageParent.toString(),
                '--input', jpInput.toString(),
                '--main-jar', appJar,
                '--main-class', 'io.ghidrauniversal.app.Launcher',
                '--runtime-image', runtimeImage,
                '--java-options', '-Dapp.home=$APPDIR',
                '--java-options', '--module-path', '--java-options', '$APPDIR/javafx',
                '--java-options', '--add-modules',
                '--java-options', 'javafx.controls,javafx.graphics,javafx.base',
                '--app-version', appVersion

        doLast {
            // Inject JavaFX and Ghidra into the image's app directory ($APPDIR).
            def imageRoot = new File(jpImageParent, 'ghidra-universal')
            def appData
            if (currentOs.isWindows()) {
                appData = new File(imageRoot, 'app')
            } else if (currentOs.isMacOsX()) {
                appData = new File(jpImageParent, 'ghidra-universal.app/Contents/app')
            } else {
                appData = new File(imageRoot, 'lib/app')
            }
            copy { from jpFx; into new File(appData, 'javafx') }
            copy {
                from rootProject.ext.ghidraInstallDir
                into new File(appData, 'ghidra')
            }
            logger.lifecycle("jpackage app-image at ${imageRoot} (JavaFX + Ghidra injected into ${appData})")
        }
    }

    tasks.register('jpackageExe') {
        group = 'bundling'
        description = 'Alias: build the portable app-image with the native launcher.'
        dependsOn 'jpackageImage'
    }

    tasks.register('jpackageZip', Zip) {
        group = 'bundling'
        description = 'Zip the jpackage app-image for distribution.'
        dependsOn 'jpackageImage'
        def os = org.gradle.internal.os.OperatingSystem.current()
        def osName = os.isWindows() ? 'windows' : (os.isMacOsX() ? 'macos' : 'linux')
        archiveFileName = "ghidra-universal-${project.version}-${osName}-app.zip"
        destinationDirectory = distRoot
        from(jpImageParent)
    }
}
