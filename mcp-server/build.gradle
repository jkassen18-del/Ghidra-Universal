// mcp-server — local HTTP/SSE MCP endpoint exposing the engine to AI clients.
// Uses the JDK's built-in HttpServer; no web framework dependency.

dependencies {
    api project(':core')
    api project(':engine-ghidra')
}

// End-to-end MCP check over HTTP+SSE against a real binary. Requires GHIDRA_INSTALL_DIR.
//   ./gradlew :mcp-server:mcpSmoke -Pbinary=/path/to/sample [-Pworkspace=/tmp/gu]
tasks.register('mcpSmoke', JavaExec) {
    group = 'verification'
    description = 'Drive the MCP server end to end (initialize, tools/list, tools/call).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.ghidrauniversal.mcp.McpSmoke'
    def binaryPath = project.findProperty('binary') ?: ''
    def workspacePath = project.findProperty('workspace')
            ?: "${layout.buildDirectory.get()}/mcp-smoke-ws"
    args = [binaryPath.toString(), workspacePath.toString()]
}
